<!DOCTYPE html>
<html>
<head>
    <title>Audit Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="navbar">
    <strong>Audit Logs</strong>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Profile</a>
        <a href="/admin">Admin Panel</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card success">
        <h1>Audit Log</h1>
        <p>Security events captured during the current application session.</p>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>User</th>
                    <th>Email</th>
                    <th>Action</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.time }}</td>
                    <td>{{ log.user }}</td>
                    <td>{{ log.email }}</td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
